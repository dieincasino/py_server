services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    expose:
      - "${BACKEND_PORT}"
    networks:
      - ${NETWORK_NAME}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ${NETWORK_NAME}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3


networks:
  app_network:
    driver: bridge
